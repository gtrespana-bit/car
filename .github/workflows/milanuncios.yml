name: milanuncios
on:
  push:
    branches: [arena/01a0d597-car]
    paths: [scripts/milanuncios-scrape.mjs, .github/workflows/milanuncios.yml, data/milanuncios/trigger]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/milanuncios-scrape.mjs
      - run: |
          git config user.name "milanuncios-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/milanuncios/raw.json
          git commit -m "milanuncios: captura automática" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
